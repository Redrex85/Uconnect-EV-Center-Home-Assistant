# ============================================================
#  UCONNECT EV CENTER — ESEMPI DI AUTOMAZIONI (facoltativi)
# ============================================================
# L'integrazione NON scrive mai in automations.yaml: queste automazioni
# sono solo esempi. Avvio/stop della ricarica programmata, notifica di
# fine ricarica e avviso batteria bassa sono gia' nativi: non servono.
#
# Copia in automations.yaml (o in un package) solo quello che ti serve e
# adatta il servizio di notifica al tuo dispositivo (qui notify.mobile_app).
# ============================================================

automation:

  # Riassunto serale: km, energia e costo del giorno
  - alias: "Uconnect EV Center - Riassunto giornaliero"
    id: uconnect_ev_center_riassunto_giornaliero
    trigger:
      - platform: time
        at: "21:30:00"
    condition:
      - condition: numeric_state
        entity_id: sensor.uconnect_km_giornalieri
        above: 0.5
    action:
      - service: notify.mobile_app
        data:
          title: "Oggi con la tua auto"
          message: >-
            Km oggi: {{ states('sensor.uconnect_km_giornalieri') }} km
            Energia consumata oggi:
            {% set kwh = states('sensor.uconnect_energia_batteria_giornaliero') | float(none) %}
            {% if kwh is not none %}{{ kwh | round(2) }} kWh{% else %}non disponibile{% endif %}
            Costo (tariffa casa):
            {% set prezzo = states('number.uconnect_costo_energia_casa') | float(none) %}
            {% if kwh is not none and prezzo is not none %}{{ (kwh * prezzo) | round(2) }} euro{% else %}non disponibile{% endif %}

  # Aggiornamento periodico della posizione/odometro dal cloud Uconnect
  - alias: "Uconnect EV Center - Aggiorna posizione auto"
    id: uconnect_ev_center_aggiorna_posizione
    trigger:
      - platform: time_pattern
        minutes: "/30"
    action:
      - service: uconnect_ev_center.refresh_car
